<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" id="meta-desc" content=""/>
  <meta property="og:title"       id="og-title" content="NextLink MW"/>
  <meta property="og:description" id="og-desc"  content=""/>
  <meta property="og:image"       id="og-image" content=""/>
  <meta property="og:type" content="website"/>
  <title id="page-title">NextLink MW</title>
  <link rel="icon" id="favicon" href=""/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #E9EEF3; --card: #EEF2F6; --inset: #E3E8ED;
      --tx-1:  #2E3A46; --tx-2: #6B7A89; --tx-3: #A3AFBC;
      --blue:  #4A7FE0; --green: #4CB963; --red: #E4574C;
      --sh-l:  rgba(255,255,255,0.85); --sh-d: rgba(163,177,198,0.55);
      --raised:    -6px -6px 14px var(--sh-l),  6px  6px 14px var(--sh-d);
      --raised-lg: -10px -10px 24px var(--sh-l), 10px 10px 24px var(--sh-d);
      --inset-sh:  inset -4px -4px 10px var(--sh-l), inset 4px 4px 10px var(--sh-d);
      --r: 14px; --r-md: 20px; --r-lg: 28px;
      --tf: 100ms ease-in-out; --tn: 200ms ease-in-out; --ts: 350ms ease-in-out;
    }
    [data-theme="dark"] {
      --bg: #1C2126; --card: #21262C; --inset: #171B1F;
      --tx-1: #E8ECF0; --tx-2: #9AA5B1; --tx-3: #626C77;
      --blue: #6B9BFF; --green: #5FD37D; --red: #F2695E;
      --sh-l: rgba(255,255,255,0.04); --sh-d: rgba(0,0,0,0.55);
    }
    html { scroll-behavior: smooth; }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--tx-1); transition:background var(--ts),color var(--ts); }

    /* ── NAV ── */
    nav {
      position:fixed; top:16px; left:50%; transform:translateX(-50%);
      z-index:200; width:calc(100% - 48px); max-width:1080px;
      background:var(--card); border-radius:var(--r-lg); box-shadow:var(--raised-lg);
      padding:14px 28px; display:flex; justify-content:space-between; align-items:center;
    }
    .logo { font-size:1.2rem; font-weight:800; color:var(--tx-1); text-decoration:none; }
    .logo span { color:var(--blue); }
    .nav-links { display:flex; gap:4px; list-style:none; }
    .nav-links a {
      color:var(--tx-2); text-decoration:none; font-size:0.85rem; font-weight:500;
      padding:8px 14px; border-radius:var(--r); transition:color var(--tn),box-shadow var(--tn),background var(--tn);
    }
    .nav-links a:hover { color:var(--tx-1); }
    .nav-links a.active { color:var(--blue); box-shadow:var(--inset-sh); background:var(--inset); }
    .nav-right { display:flex; align-items:center; gap:10px; }
    .nav-cta {
      background:var(--blue); color:#fff; padding:9px 20px; border-radius:var(--r);
      font-size:0.82rem; font-weight:600; text-decoration:none; box-shadow:var(--raised);
      transition:box-shadow var(--tf),transform var(--tf);
    }
    .nav-cta:hover { transform:translateY(-1px); }
    .nav-cta:active { box-shadow:var(--inset-sh); transform:translateY(0); }
    #theme-btn {
      width:38px; height:38px; border-radius:50%; background:var(--card); box-shadow:var(--raised);
      border:none; cursor:pointer; color:var(--tx-2); font-size:0.95rem;
      display:flex; align-items:center; justify-content:center; transition:box-shadow var(--tf),color var(--tn);
    }
    #theme-btn:hover { color:var(--blue); }
    #theme-btn:active { box-shadow:var(--inset-sh); }

    /* ── HERO ── */
    #hero { min-height:100vh; display:flex; align-items:center; padding:140px 24px 80px; }
    .hero-wrap { max-width:1100px; margin:0 auto; width:100%; display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center; }
    .hero-left {}
    .hero-badge {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--inset); box-shadow:var(--inset-sh); border-radius:99px;
      padding:6px 16px; font-size:0.72rem; font-weight:700; color:var(--blue);
      letter-spacing:1.5px; text-transform:uppercase; margin-bottom:24px;
    }
    #hero h1 { font-size:clamp(1.6rem,3vw,2.5rem); font-weight:800; line-height:1.2; margin-bottom:18px; }
    #hero h1 em { font-style:normal; color:var(--blue); }
    #hero p { font-size:1rem; color:var(--tx-2); line-height:1.85; margin-bottom:36px; max-width:480px; }
    .hero-btns { display:flex; gap:12px; flex-wrap:wrap; }
    .btn-primary {
      background:var(--blue); color:#fff; padding:13px 28px; border-radius:var(--r);
      font-weight:600; font-size:0.9rem; text-decoration:none; box-shadow:var(--raised);
      transition:box-shadow var(--tf),transform var(--tf); display:inline-block;
    }
    .btn-primary:hover { transform:translateY(-2px); }
    .btn-primary:active { box-shadow:var(--inset-sh); transform:none; }
    .btn-ghost {
      background:var(--card); color:var(--tx-1); padding:13px 28px; border-radius:var(--r);
      font-weight:600; font-size:0.9rem; text-decoration:none; box-shadow:var(--raised);
      transition:box-shadow var(--tf),transform var(--tf); display:inline-block;
    }
    .btn-ghost:hover { transform:translateY(-2px); }
    .btn-ghost:active { box-shadow:var(--inset-sh); transform:none; }

    /* hero right — stats grid */
    .hero-right { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .hero-stat {
      background:var(--card); border-radius:var(--r-md); box-shadow:var(--raised);
      padding:24px 20px; transition:box-shadow var(--tn),transform var(--tn);
    }
    .hero-stat:hover { box-shadow:var(--raised-lg); transform:translateY(-2px); }
    .hero-stat:first-child { grid-column:span 1; }
    .hero-stat-icon {
      width:52px; height:52px; flex-shrink:0; border-radius:50%;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; color:var(--blue);
    }
    .stat-num { font-size:2rem; font-weight:800; color:var(--blue); line-height:1; }
    .stat-lbl { font-size:0.78rem; color:var(--tx-2); margin-top:4px; font-weight:500; }

    /* ── CONTAINER ── */
    .container { max-width:1100px; margin:0 auto; padding:0 32px; }
    section { padding:88px 0; }
    .sec-label { font-size:0.72rem; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--blue); margin-bottom:8px; }
    .sec-title { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--tx-1); margin-bottom:12px; line-height:1.25; }
    .sec-sub   { color:var(--tx-2); font-size:0.95rem; max-width:500px; line-height:1.8; }

    /* ── SERVICES ── */
    #services { background:var(--bg); }
    .services-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; margin-top:48px; }
    .svc-card {
      background:var(--card); border-radius:var(--r-md); box-shadow:var(--raised);
      padding:26px; transition:box-shadow var(--tn),transform var(--tn);
    }
    .svc-card:hover { box-shadow:var(--raised-lg); transform:translateY(-3px); }
    .svc-icon {
      width:48px; height:48px; border-radius:var(--r); margin-bottom:16px;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; color:var(--blue);
    }
    .svc-card h3 { font-size:0.92rem; font-weight:700; margin-bottom:8px; }
    .svc-card p  { font-size:0.82rem; color:var(--tx-2); line-height:1.75; }

    /* ── WHY ── */
    #why { background:var(--bg); }
    .why-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start; margin-top:48px; }
    .why-items { display:flex; flex-direction:column; gap:14px; }
    .why-card {
      background:var(--card); border-radius:var(--r-md); box-shadow:var(--raised);
      padding:20px; display:flex; gap:14px; align-items:flex-start;
      transition:box-shadow var(--tn),transform var(--tn);
    }
    .why-card:hover { box-shadow:var(--raised-lg); transform:translateX(4px); }
    .why-dot {
      width:34px; height:34px; flex-shrink:0; border-radius:50%;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center;
      font-size:0.8rem; color:var(--blue);
    }
    .why-card h4 { font-size:0.88rem; font-weight:700; margin-bottom:4px; }
    .why-card p  { font-size:0.8rem; color:var(--tx-2); line-height:1.6; }
    .why-panel {
      background:var(--card); border-radius:var(--r-lg); box-shadow:var(--raised-lg);
      padding:36px; text-align:center; position:sticky; top:100px;
    }
    .why-dial {
      width:110px; height:110px; border-radius:50%; margin:0 auto 24px;
      background:var(--card); box-shadow:var(--raised-lg);
      display:flex; align-items:center; justify-content:center;
    }
    .why-dial .inner {
      width:74px; height:74px; border-radius:50%;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center;
      font-size:1.7rem; color:var(--blue);
    }
    .why-panel h3 { font-size:1.05rem; font-weight:700; margin-bottom:10px; }
    .why-panel p  { font-size:0.84rem; color:var(--tx-2); line-height:1.75; margin-bottom:20px; }
    .why-cta {
      display:inline-block; background:var(--blue); color:#fff;
      padding:11px 24px; border-radius:var(--r); font-size:0.85rem; font-weight:600;
      text-decoration:none; box-shadow:var(--raised);
      transition:box-shadow var(--tf),transform var(--tf);
    }
    .why-cta:hover { transform:translateY(-1px); }
    .why-cta:active { box-shadow:var(--inset-sh); transform:none; }

    /* ── PROJECTS ── */
    #projects { background:var(--bg); }
    .proj-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; margin-top:48px; }
    .proj-card {
      background:var(--card); border-radius:var(--r-md); box-shadow:var(--raised);
      padding:24px; transition:box-shadow var(--tn),transform var(--tn);
      display:flex; flex-direction:column;
    }
    .proj-card:hover { box-shadow:var(--raised-lg); transform:translateY(-3px); }
    .proj-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .proj-emoji {
      width:42px; height:42px; border-radius:var(--r); flex-shrink:0;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }
    .proj-card h3 { font-size:0.92rem; font-weight:700; }
    .proj-card p  { font-size:0.82rem; color:var(--tx-2); line-height:1.7; margin-bottom:14px; flex:1; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .tag {
      background:var(--inset); box-shadow:var(--inset-sh); border-radius:99px;
      padding:3px 11px; font-size:0.7rem; font-weight:600; color:var(--blue);
    }
    .proj-link {
      display:inline-flex; align-items:center; gap:6px;
      font-size:0.78rem; font-weight:600; color:var(--blue); text-decoration:none;
      transition:gap var(--tn);
    }
    .proj-link:hover { gap:10px; }

    /* ── CONTACT ── */
    #contact { background:var(--bg); }
    .contact-layout { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start; margin-top:48px; }
    .contact-cards { display:flex; flex-direction:column; gap:14px; }
    .ct-card {
      background:var(--card); border-radius:var(--r-md); box-shadow:var(--raised);
      padding:18px 22px; display:flex; align-items:center; gap:16px;
      text-decoration:none; color:var(--tx-1);
      transition:box-shadow var(--tn),transform var(--tn);
    }
    .ct-card:hover { box-shadow:var(--raised-lg); transform:translateX(4px); }
    .ct-icon {
      width:42px; height:42px; flex-shrink:0; border-radius:50%;
      background:var(--inset); box-shadow:var(--inset-sh);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; color:var(--blue);
    }
    .ct-label { font-size:0.7rem; color:var(--tx-3); font-weight:600; letter-spacing:1px; text-transform:uppercase; }
    .ct-value { font-size:0.88rem; font-weight:500; color:var(--tx-1); }
    .contact-panel {
      background:var(--card); border-radius:var(--r-lg); box-shadow:var(--raised-lg);
      padding:36px; position:sticky; top:100px;
    }
    .contact-panel h3 { font-size:1.1rem; font-weight:700; margin-bottom:8px; }
    .contact-panel p  { font-size:0.85rem; color:var(--tx-2); line-height:1.75; margin-bottom:24px; }
    .biz-hours {
      display:flex; align-items:center; gap:10px;
      background:var(--inset); box-shadow:var(--inset-sh); border-radius:var(--r);
      padding:12px 16px; font-size:0.82rem; color:var(--tx-2); margin-bottom:20px;
    }
    .biz-hours i { color:var(--blue); }
    .social-bar { display:flex; gap:10px; }
    .soc-btn {
      width:40px; height:40px; border-radius:50%;
      background:var(--card); box-shadow:var(--raised);
      display:flex; align-items:center; justify-content:center;
      color:var(--tx-2); text-decoration:none; font-size:0.95rem;
      transition:color var(--tn),box-shadow var(--tn),transform var(--tn);
    }
    .soc-btn:hover { color:var(--blue); transform:translateY(-2px); box-shadow:var(--raised-lg); }

    /* ── MAPS ── */
    .maps-wrap { border-radius:var(--r-md); overflow:hidden; box-shadow:var(--raised); margin-top:16px; }

    /* ── FOOTER ── */
    footer {
      background:var(--card); box-shadow:var(--raised);
      text-align:center; padding:24px; font-size:0.8rem; color:var(--tx-3);
    }
    footer span { color:var(--blue); }

    /* ── FOCUS ── */
    a:focus-visible, button:focus-visible { outline:2px solid var(--blue); outline-offset:3px; border-radius:4px; }

    /* ── RESPONSIVE ── */
    @media (max-width:900px) {
      .hero-wrap         { grid-template-columns:1fr; }
      .hero-right        { display:none; }
      .why-grid          { grid-template-columns:1fr; }
      .why-panel         { position:static; }
      .contact-layout    { grid-template-columns:1fr; }
      .contact-panel     { position:static; }
    }
    @media (max-width:680px) {
      nav { top:10px; width:calc(100% - 24px); padding:12px 16px; }
      .nav-links { display:none; }
      .container { padding:0 16px; }
      section { padding:64px 0; }
    }

  </style>
</head>
<body>

<nav>
  <a class="logo" href="#" id="nav-logo"></a>
  <ul class="nav-links">
    <li><a href="#services">Services</a></li>
    <li><a href="#why">Why Us</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <div class="nav-right">
    <button id="theme-btn" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
    <a class="nav-cta" id="nav-cta" href="#contact"></a>
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-wrap">
    <div class="hero-left">
      <div class="hero-badge" id="hero-badge"></div>
      <h1 id="hero-heading"></h1>
      <p id="hero-sub"></p>
      <div class="hero-btns">
        <a class="btn-primary" id="hero-btn-p" href="#services"></a>
        <a class="btn-ghost"   id="hero-btn-g" href="#contact"></a>
      </div>
    </div>
    <div class="hero-right" id="stats-grid"></div>
  </div>
</section>

<!-- SERVICES -->
<section id="services">
  <div class="container">
    <div class="sec-label" id="svc-label"></div>
    <div class="sec-title" id="svc-title"></div>
    <p class="sec-sub"     id="svc-sub"></p>
    <div class="services-grid" id="services-grid"></div>
  </div>
</section>

<!-- WHY -->
<section id="why">
  <div class="container">
    <div class="sec-label" id="why-label"></div>
    <div class="sec-title" id="why-title"></div>
    <div class="why-grid">
      <div class="why-items" id="why-list"></div>
      <div class="why-panel">
        <div class="why-dial"><div class="inner"><i class="fas fa-laptop-code"></i></div></div>
        <h3 id="why-panel-h"></h3>
        <p  id="why-panel-p"></p>
        <a class="why-cta" href="#contact">Get in Touch</a>
      </div>
    </div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="container">
    <div class="sec-label" id="proj-label"></div>
    <div class="sec-title" id="proj-title"></div>
    <p class="sec-sub"     id="proj-sub"></p>
    <div class="proj-grid" id="projects-grid"></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="container">
    <div class="sec-label" id="ct-label"></div>
    <div class="sec-title" id="ct-title"></div>
    <p class="sec-sub"     id="ct-sub"></p>
    <div class="contact-layout">
      <div class="contact-cards" id="contact-cards"></div>
      <div class="contact-panel">
        <h3 id="ct-panel-h">Start a Conversation</h3>
        <p  id="ct-panel-p">Tell us what you need built. We'll tell you if we can build it — and how long it'll take.</p>
        <div id="biz-hours-wrap"></div>
        <a class="btn-primary" id="ct-btn" href="#" style="width:100%;text-align:center;display:block;"></a>
        <div id="social-wrap" style="margin-top:20px;"></div>
        <div id="maps-wrap"></div>
      </div>
    </div>
  </div>
</section>

<footer><p id="footer-text"></p></footer>

<script>
const REPO  = 'Nehemiahnganjo/nextlinkmw';
const CACHE = 'nxlmw_v3';

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(c) {
  // accent
  if (c.branding?.accent_color)
    document.documentElement.style.setProperty('--blue', c.branding.accent_color);

  // theme
  const saved = localStorage.getItem('theme');
  if (!saved && c.branding?.default_theme)
    document.documentElement.setAttribute('data-theme', c.branding.default_theme);

  // meta
  document.title = c.site.title;
  document.getElementById('meta-desc').content = c.site.description;
  document.getElementById('og-title').content  = c.site.title;
  document.getElementById('og-desc').content   = c.site.description;
  if (c.branding?.og_image) document.getElementById('og-image').content = c.branding.og_image;
  if (c.branding?.favicon)  document.getElementById('favicon').href     = c.branding.favicon;

  // GA4
  if (c.analytics?.enabled && c.analytics?.ga4_id) {
    const s = document.createElement('script');
    s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${c.analytics.ga4_id}`;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} gtag('js',new Date()); gtag('config',c.analytics.ga4_id);
  }

  // nav
  const parts = c.site.logo.split('Link');
  document.getElementById('nav-logo').innerHTML = '<span>'+esc(parts[0])+'</span>Link'+esc(parts[1]||'');
  const cta = document.getElementById('nav-cta');
  cta.textContent = c.nav.cta_text; cta.href = c.nav.cta_href;

  // hero
  document.getElementById('hero-badge').innerHTML = '<i class="fas fa-map-marker-alt"></i> '+esc(c.hero.badge);
  document.getElementById('hero-heading').innerHTML = esc(c.hero.heading_line1)+'<br/><em>'+esc(c.hero.heading_line2)+'</em>';
  document.getElementById('hero-sub').textContent = c.hero.subtext;
  const bp = document.getElementById('hero-btn-p'); bp.textContent = c.hero.btn_primary_text; bp.href = c.hero.btn_primary_href;
  const bg = document.getElementById('hero-btn-g'); bg.textContent = c.hero.btn_ghost_text;   bg.href = c.hero.btn_ghost_href;

  // stats — first one spans 2 cols with icon
  const icons = ['fa-calendar','fa-boxes-stacked','fa-industry','fa-headset'];
  document.getElementById('stats-grid').innerHTML = c.stats.map((s,i) =>
    i===0
    ? `<div class="hero-stat">
        <div class="hero-stat-icon"><i class="fas ${icons[i]}"></i></div>
        <div><div class="stat-num">${esc(s.number)}</div><div class="stat-lbl">${esc(s.label)}</div></div>
      </div>`
    : `<div class="hero-stat"><div class="stat-num">${esc(s.number)}</div><div class="stat-lbl">${esc(s.label)}</div></div>`
  ).join('');

  // services
  document.getElementById('svc-label').textContent = c.services.label;
  document.getElementById('svc-title').innerHTML   = esc(c.services.title_line1)+'<br/>'+esc(c.services.title_line2);
  document.getElementById('svc-sub').textContent   = c.services.subtext;
  document.getElementById('services-grid').innerHTML = c.services.items
    .filter(s => s.visible !== false)
    .map(s => `<div class="svc-card">
      <div class="svc-icon"><i class="fas ${esc(s.icon)}"></i></div>
      <h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>
    </div>`).join('');

  // why
  document.getElementById('why-label').textContent = c.why.label;
  document.getElementById('why-title').innerHTML   = esc(c.why.title_line1)+'<br/>'+esc(c.why.title_line2);
  document.getElementById('why-panel-h').textContent = c.why.panel_heading;
  document.getElementById('why-panel-p').textContent = c.why.panel_body;
  document.getElementById('why-list').innerHTML = c.why.items.map(w =>
    `<div class="why-card">
      <div class="why-dot"><i class="fas ${esc(w.icon)}"></i></div>
      <div><h4>${esc(w.title)}</h4><p>${esc(w.body)}</p></div>
    </div>`).join('');

  // projects
  document.getElementById('proj-label').textContent = c.projects.label;
  document.getElementById('proj-title').textContent = c.projects.title;
  document.getElementById('proj-sub').textContent   = c.projects.subtext;
  document.getElementById('projects-grid').innerHTML = c.projects.items
    .filter(p => p.visible !== false)
    .map(p => `<div class="proj-card">
      <div class="proj-header">
        <div class="proj-emoji">${esc(p.emoji)}</div>
        <h3>${esc(p.title)}</h3>
      </div>
      <p>${esc(p.body)}</p>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${p.link ? `<a class="proj-link" href="${esc(p.link)}" target="_blank">View Project <i class="fas fa-arrow-up-right-from-square"></i></a>` : ''}
    </div>`).join('');

  // contact cards
  document.getElementById('ct-label').textContent = c.contact.label;
  document.getElementById('ct-title').textContent = c.contact.title;
  document.getElementById('ct-sub').textContent   = c.contact.subtext;
  document.getElementById('contact-cards').innerHTML = c.contact.items.map(i => {
    const iconCls = i.icon.includes('fab') ? i.icon : 'fas '+i.icon;
    return `<a class="ct-card" href="${esc(i.href)}" ${i.href.startsWith('http')?'target="_blank"':''}>
      <div class="ct-icon"><i class="${esc(iconCls)}"></i></div>
      <div><div class="ct-label">${esc(i.label)}</div><div class="ct-value">${esc(i.text)}</div></div>
    </a>`;
  }).join('');

  // biz hours
  if (c.contact.business_hours) {
    document.getElementById('biz-hours-wrap').innerHTML =
      `<div class="biz-hours"><i class="fas fa-clock"></i> ${esc(c.contact.business_hours)}</div>`;
  }

  // CTA button — WhatsApp prefill if available
  const ctBtn = document.getElementById('ct-btn');
  ctBtn.textContent = c.contact.btn_text;
  const wa = c.social?.whatsapp_number;
  const wm = c.social?.whatsapp_prefill || '';
  ctBtn.href = wa ? `https://wa.me/${wa}?text=${encodeURIComponent(wm)}` : (c.contact.items[0]?.href||'#');

  // social icons
  const soc = c.social || {};
  const socDefs = [
    {k:'facebook', i:'fab fa-facebook'}, {k:'twitter', i:'fab fa-x-twitter'},
    {k:'linkedin', i:'fab fa-linkedin'}, {k:'github',  i:'fab fa-github'},
  ].filter(s => soc[s.k]);
  if (socDefs.length) {
    document.getElementById('social-wrap').innerHTML =
      `<div class="social-bar">${socDefs.map(s =>
        `<a class="soc-btn" href="${esc(soc[s.k])}" target="_blank"><i class="${s.i}"></i></a>`
      ).join('')}</div>`;
  }

  // maps
  if (c.contact.maps_embed) {
    document.getElementById('maps-wrap').innerHTML =
      `<div class="maps-wrap"><iframe src="${esc(c.contact.maps_embed)}"
        width="100%" height="220" style="border:0;display:block;" allowfullscreen loading="lazy"></iframe></div>`;
  }

  // footer
  document.getElementById('footer-text').innerHTML =
    c.footer.text.replace('NextLink MW','<span>NextLink MW</span>');

  // scroll spy
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.nav-links a').forEach(l=>l.classList.remove('active'));
        document.querySelector(`.nav-links a[href="#${e.target.id}"]`)?.classList.add('active');
      }
    });
  },{threshold:0.35});
  document.querySelectorAll('section[id]').forEach(s=>obs.observe(s));
}

// theme
const btn=document.getElementById('theme-btn'),root=document.documentElement,icon=btn.querySelector('i');
const sv=localStorage.getItem('theme')||'light';
root.setAttribute('data-theme',sv); icon.className=sv==='dark'?'fas fa-sun':'fas fa-moon';
btn.addEventListener('click',()=>{
  const n=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',n); localStorage.setItem('theme',n);
  icon.className=n==='dark'?'fas fa-sun':'fas fa-moon';
});

// load
fetch(`https://raw.githubusercontent.com/${REPO}/main/content.json?_=${Date.now()}`)
  .then(r=>r.json())
  .then(c=>{sessionStorage.setItem(CACHE,JSON.stringify(c));render(c);})
  .catch(()=>{const c=sessionStorage.getItem(CACHE);if(c)render(JSON.parse(c));});
</script>
</body>
</html>
