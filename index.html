<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" id="meta-desc" content=""/>
  <meta property="og:title"       id="og-title"       content="NextLink MW"/>
  <meta property="og:description" id="og-desc"        content=""/>
  <meta property="og:image"       id="og-image"       content=""/>
  <meta property="og:type"        content="website"/>
  <title id="page-title">NextLink MW</title>
  <link rel="icon" id="favicon" href=""/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg-base:   #E9EEF3;
      --bg-card:   #EEF2F6;
      --bg-inset:  #E3E8ED;
      --tx-1: #2E3A46; --tx-2: #6B7A89; --tx-3: #A3AFBC;
      --acc-green: #4CB963; --acc-green-bg: #E4F5E8;
      --acc-red:   #E4574C; --acc-red-bg:   #FBE7E5;
      --acc-blue:  #4A7FE0;
      --sh-l: rgba(255,255,255,0.85);
      --sh-d: rgba(163,177,198,0.55);
      --r-sm: 14px; --r-md: 20px; --r-lg: 28px;
      --raised:    -6px -6px 14px var(--sh-l),  6px  6px 14px var(--sh-d);
      --raised-lg: -10px -10px 24px var(--sh-l), 10px 10px 24px var(--sh-d);
      --inset:     inset -4px -4px 10px var(--sh-l), inset 4px 4px 10px var(--sh-d);
      --t-fast: 100ms ease-in-out;
      --t-norm: 200ms ease-in-out;
      --t-slow: 350ms ease-in-out;
    }
    [data-theme="dark"] {
      --bg-base:   #1C2126; --bg-card: #21262C; --bg-inset: #171B1F;
      --tx-1: #E8ECF0; --tx-2: #9AA5B1; --tx-3: #626C77;
      --acc-green: #5FD37D; --acc-green-bg: #1E3324;
      --acc-red:   #F2695E; --acc-red-bg:   #3A2220;
      --acc-blue:  #6B9BFF;
      --sh-l: rgba(255,255,255,0.04);
      --sh-d: rgba(0,0,0,0.55);
    }

    /* ── BASE ───────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-base);
      color: var(--tx-1);
      transition: background var(--t-slow), color var(--t-slow);
    }

    /* ── UTILITIES ──────────────────────────────────────────── */
    .neu-card  { background: var(--bg-card);  border-radius: var(--r-md); box-shadow: var(--raised);    padding: 24px; }
    .neu-hero  { background: var(--bg-card);  border-radius: var(--r-lg); box-shadow: var(--raised-lg); padding: 32px; }
    .neu-inset { background: var(--bg-inset); border-radius: var(--r-md); box-shadow: var(--inset);     padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
    section { padding: 88px 0; }
    .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--acc-blue); margin-bottom: 8px;
    }
    .section-title { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; color: var(--tx-1); margin-bottom: 12px; line-height: 1.25; }
    .section-sub   { color: var(--tx-2); font-size: 0.95rem; max-width: 500px; line-height: 1.8; }

    /* ── NAV ────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 200; width: calc(100% - 48px); max-width: 1080px;
      background: var(--bg-card);
      border-radius: var(--r-lg);
      box-shadow: var(--raised-lg);
      padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
      transition: box-shadow var(--t-norm), background var(--t-slow);
    }
    .logo { font-size: 1.2rem; font-weight: 800; color: var(--tx-1); text-decoration: none; }
    .logo span { color: var(--acc-blue); }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a {
      color: var(--tx-2); text-decoration: none; font-size: 0.85rem; font-weight: 500;
      padding: 8px 14px; border-radius: var(--r-sm);
      transition: color var(--t-norm), box-shadow var(--t-norm), background var(--t-norm);
    }
    .nav-links a:hover { color: var(--tx-1); }
    .nav-links a.active {
      color: var(--acc-blue);
      box-shadow: var(--inset);
      background: var(--bg-inset);
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-cta {
      background: var(--acc-blue); color: #fff;
      padding: 9px 20px; border-radius: var(--r-sm);
      font-size: 0.82rem; font-weight: 600; text-decoration: none;
      box-shadow: var(--raised); transition: box-shadow var(--t-fast), transform var(--t-fast);
    }
    .nav-cta:hover  { transform: translateY(-1px); }
    .nav-cta:active { box-shadow: var(--inset); transform: translateY(0); }

    /* Theme toggle */
    #theme-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-card); box-shadow: var(--raised);
      border: none; cursor: pointer; color: var(--tx-2);
      font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: box-shadow var(--t-fast), color var(--t-norm);
    }
    #theme-btn:hover  { color: var(--acc-blue); }
    #theme-btn:active { box-shadow: var(--inset); }

    /* ── HERO ───────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 140px 24px 80px;
    }
    .hero-inner { max-width: 680px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-inset); box-shadow: var(--inset);
      border-radius: 99px; padding: 6px 18px;
      font-size: 0.75rem; font-weight: 600;
      color: var(--acc-blue); letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 28px;
    }
    .hero-badge i { font-size: 0.7rem; }
    #hero h1 {
      font-size: clamp(2.2rem, 5.5vw, 3.8rem);
      font-weight: 800; line-height: 1.15; margin-bottom: 20px; color: var(--tx-1);
    }
    #hero h1 em { font-style: normal; color: var(--acc-blue); }
    #hero p { font-size: 1rem; color: var(--tx-2); line-height: 1.85; margin-bottom: 40px; }
    .hero-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--acc-blue); color: #fff; padding: 14px 32px;
      border-radius: var(--r-sm); font-weight: 600; font-size: 0.92rem;
      text-decoration: none; box-shadow: var(--raised);
      transition: box-shadow var(--t-fast), transform var(--t-fast);
    }
    .btn-primary:hover  { transform: translateY(-2px); }
    .btn-primary:active { box-shadow: var(--inset); transform: translateY(0); }
    .btn-ghost {
      background: var(--bg-card); color: var(--tx-1); padding: 14px 32px;
      border-radius: var(--r-sm); font-weight: 600; font-size: 0.92rem;
      text-decoration: none; box-shadow: var(--raised);
      transition: box-shadow var(--t-fast), transform var(--t-fast);
    }
    .btn-ghost:hover  { transform: translateY(-2px); }
    .btn-ghost:active { box-shadow: var(--inset); transform: translateY(0); }

    /* ── STATS BAR ──────────────────────────────────────────── */
    .stats-bar { padding: 0 0 80px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    .stat-tile {
      background: var(--bg-card); border-radius: var(--r-md); box-shadow: var(--raised);
      padding: 24px; text-align: center;
      transition: box-shadow var(--t-norm);
    }
    .stat-tile:hover { box-shadow: var(--raised-lg); }
    .stat-num  { font-size: 2.2rem; font-weight: 800; color: var(--acc-blue); line-height: 1; }
    .stat-lbl  { font-size: 0.78rem; color: var(--tx-2); margin-top: 6px; font-weight: 500; }

    /* ── SERVICES ───────────────────────────────────────────── */
    #services { background: var(--bg-base); }
    .services-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; margin-top: 48px;
    }
    .service-card {
      background: var(--bg-card); border-radius: var(--r-md); box-shadow: var(--raised);
      padding: 28px; transition: box-shadow var(--t-norm), transform var(--t-norm);
    }
    .service-card:hover { box-shadow: var(--raised-lg); transform: translateY(-3px); }
    .svc-icon {
      width: 52px; height: 52px; border-radius: var(--r-sm);
      background: var(--bg-inset); box-shadow: var(--inset);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: var(--acc-blue); margin-bottom: 18px;
    }
    .service-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: var(--tx-1); }
    .service-card p  { font-size: 0.84rem; color: var(--tx-2); line-height: 1.75; }

    /* ── WHY ────────────────────────────────────────────────── */
    #why { background: var(--bg-base); }
    .why-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; margin-top: 48px; }
    .why-list { display: flex; flex-direction: column; gap: 20px; }
    .why-item {
      display: flex; gap: 16px; align-items: flex-start;
      background: var(--bg-card); border-radius: var(--r-md); box-shadow: var(--raised);
      padding: 20px;
      transition: box-shadow var(--t-norm);
    }
    .why-item:hover { box-shadow: var(--raised-lg); }
    .why-dot {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--bg-inset); box-shadow: var(--inset);
      display: flex; align-items: center; justify-content: center;
      color: var(--acc-blue); font-size: 0.85rem;
    }
    .why-item h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--tx-1); }
    .why-item p  { font-size: 0.82rem; color: var(--tx-2); line-height: 1.6; }
    .why-panel {
      background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--raised-lg);
      padding: 40px; text-align: center;
    }
    .why-panel-dial {
      width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 28px;
      background: var(--bg-card); box-shadow: var(--raised-lg);
      display: flex; align-items: center; justify-content: center;
    }
    .why-panel-dial .inner {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--bg-inset); box-shadow: var(--inset);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: var(--acc-blue);
    }
    .why-panel h3 { font-size: 1.15rem; font-weight: 700; color: var(--tx-1); margin-bottom: 10px; }
    .why-panel p  { font-size: 0.86rem; color: var(--tx-2); line-height: 1.75; }

    /* ── PROJECTS ───────────────────────────────────────────── */
    #projects { background: var(--bg-base); }
    .projects-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px; margin-top: 48px;
    }
    .project-card {
      background: var(--bg-card); border-radius: var(--r-md); box-shadow: var(--raised);
      padding: 24px; transition: box-shadow var(--t-norm), transform var(--t-norm);
    }
    .project-card:hover { box-shadow: var(--raised-lg); transform: translateY(-3px); }
    .project-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: var(--tx-1); }
    .project-card p  { font-size: 0.83rem; color: var(--tx-2); line-height: 1.7; margin-bottom: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: var(--bg-inset); box-shadow: var(--inset);
      border-radius: 99px; padding: 4px 12px;
      font-size: 0.72rem; font-weight: 600; color: var(--acc-blue);
    }

    /* ── CONTACT ────────────────────────────────────────────── */
    #contact { background: var(--bg-base); text-align: center; }
    .contact-grid {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 48px 0;
    }
    .contact-card {
      background: var(--bg-card); border-radius: var(--r-md); box-shadow: var(--raised);
      padding: 28px 32px; min-width: 180px; text-align: center;
      transition: box-shadow var(--t-norm), transform var(--t-norm);
    }
    .contact-card:hover { box-shadow: var(--raised-lg); transform: translateY(-3px); }
    .contact-icon {
      width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 14px;
      background: var(--bg-inset); box-shadow: var(--inset);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--acc-blue);
    }
    .contact-card p   { font-size: 0.75rem; color: var(--tx-3); margin-bottom: 4px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .contact-card a   { color: var(--tx-1); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color var(--t-norm); }
    .contact-card a:hover { color: var(--acc-blue); }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      background: var(--bg-card); box-shadow: var(--raised);
      text-align: center; padding: 24px 20px;
      font-size: 0.8rem; color: var(--tx-3);
    }
    footer span { color: var(--acc-blue); }

    /* ── FOCUS ──────────────────────────────────────────────── */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--acc-blue); outline-offset: 3px; border-radius: 4px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      nav { top: 10px; width: calc(100% - 24px); padding: 12px 16px; }
      .nav-links { display: none; }
      .why-wrap   { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .container  { padding: 0 16px; }
    }
  </style>
  <style>
    /* accent color override — set from content.json */
    :root { --acc-blue: #4A7FE0; }
    .service-card.hidden, .project-card.hidden { display: none; }
    .project-card a.proj-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; font-size: 0.8rem; font-weight: 600;
      color: var(--acc-blue); text-decoration: none;
      transition: gap 150ms;
    }
    .project-card a.proj-link:hover { gap: 10px; }
    .biz-hours {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-inset); box-shadow: var(--inset);
      border-radius: 99px; padding: 6px 16px;
      font-size: 0.78rem; color: var(--tx-2); margin-top: 16px;
    }
    .social-bar {
      display: flex; justify-content: center; gap: 12px; margin-top: 28px;
    }
    .social-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg-card); box-shadow: var(--raised);
      display: flex; align-items: center; justify-content: center;
      color: var(--tx-2); text-decoration: none; font-size: 1rem;
      transition: color var(--t-norm), box-shadow var(--t-norm), transform var(--t-norm);
    }
    .social-btn:hover { color: var(--acc-blue); transform: translateY(-2px); box-shadow: var(--raised-lg); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="#" id="nav-logo"></a>
  <ul class="nav-links">
    <li><a href="#services">Services</a></li>
    <li><a href="#why">Why Us</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <div class="nav-right">
    <button id="theme-btn" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    <a class="nav-cta" id="nav-cta" href="#contact"></a>
  </div>
</nav>

<section id="hero">
  <div class="hero-inner">
    <div class="hero-badge" id="hero-badge"></div>
    <h1 id="hero-heading"></h1>
    <p id="hero-sub"></p>
    <div class="hero-btns">
      <a class="btn-primary" id="hero-btn-primary" href="#services"></a>
      <a class="btn-ghost"   id="hero-btn-ghost"   href="#contact"></a>
    </div>
  </div>
</section>

<div class="stats-bar">
  <div class="container">
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</div>

<section id="services">
  <div class="container">
    <div class="label"         id="svc-label"></div>
    <div class="section-title" id="svc-title"></div>
    <p class="section-sub"     id="svc-sub"></p>
    <div class="services-grid" id="services-grid"></div>
  </div>
</section>

<section id="why">
  <div class="container">
    <div class="label"         id="why-label"></div>
    <div class="section-title" id="why-title"></div>
    <div class="why-wrap">
      <div class="why-list" id="why-list"></div>
      <div class="why-panel">
        <div class="why-panel-dial"><div class="inner"><i class="fas fa-laptop-code"></i></div></div>
        <h3 id="why-panel-h"></h3>
        <p  id="why-panel-p"></p>
      </div>
    </div>
  </div>
</section>

<section id="projects">
  <div class="container">
    <div class="label"         id="proj-label"></div>
    <div class="section-title" id="proj-title"></div>
    <p class="section-sub"     id="proj-sub"></p>
    <div class="projects-grid" id="projects-grid"></div>
  </div>
</section>

<section id="contact">
  <div class="container">
    <div class="label"         id="ct-label"></div>
    <div class="section-title" id="ct-title"></div>
    <p class="section-sub" style="margin:0 auto;" id="ct-sub"></p>
    <div class="contact-grid"  id="contact-grid"></div>
    <div id="biz-hours-wrap"></div>
    <div id="social-bar-wrap"></div>
    <div id="maps-wrap" style="margin-top:32px;"></div>
    <a class="btn-primary" id="ct-btn" href="#" style="margin-top:32px;"></a>
  </div>
</section>

<footer><p id="footer-text"></p></footer>

<script>
const REPO  = 'Nehemiahnganjo/nextlinkmw';
const CACHE = 'nxlmw_v2';

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(c) {
  // ── accent color
  if (c.branding?.accent_color)
    document.documentElement.style.setProperty('--acc-blue', c.branding.accent_color);

  // ── default theme
  const saved = localStorage.getItem('theme');
  if (!saved && c.branding?.default_theme)
    document.documentElement.setAttribute('data-theme', c.branding.default_theme);

  // ── favicon / OG
  if (c.branding?.favicon) document.getElementById('favicon').href = c.branding.favicon;
  if (c.branding?.og_image) document.getElementById('og-image').content = c.branding.og_image;

  // ── GA4
  if (c.analytics?.enabled && c.analytics?.ga4_id) {
    const s = document.createElement('script');
    s.async = true;
    s.src = `https://www.googletagmanager.com/gtag/js?id=${c.analytics.ga4_id}`;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', c.analytics.ga4_id);
  }

  // ── meta
  document.title = c.site.title;
  document.getElementById('meta-desc').content = c.site.description;
  document.getElementById('og-title').content  = c.site.title;
  document.getElementById('og-desc').content   = c.site.description;

  // ── nav logo
  const parts = c.site.logo.split('Link');
  document.getElementById('nav-logo').innerHTML = '<span>' + esc(parts[0]) + '</span>Link' + esc(parts[1]||'');
  const cta = document.getElementById('nav-cta');
  cta.textContent = c.nav.cta_text; cta.href = c.nav.cta_href;

  // ── hero
  document.getElementById('hero-badge').innerHTML = '<i class="fas fa-map-marker-alt"></i> ' + esc(c.hero.badge);
  document.getElementById('hero-heading').innerHTML = esc(c.hero.heading_line1) + '<br/><em>' + esc(c.hero.heading_line2) + '</em>';
  document.getElementById('hero-sub').textContent = c.hero.subtext;
  const bp = document.getElementById('hero-btn-primary');
  bp.textContent = c.hero.btn_primary_text; bp.href = c.hero.btn_primary_href;
  const bg = document.getElementById('hero-btn-ghost');
  bg.textContent = c.hero.btn_ghost_text; bg.href = c.hero.btn_ghost_href;

  // ── stats
  document.getElementById('stats-grid').innerHTML = c.stats.map(s =>
    `<div class="stat-tile"><div class="stat-num">${esc(s.number)}</div><div class="stat-lbl">${esc(s.label)}</div></div>`
  ).join('');

  // ── services (respect visible flag)
  document.getElementById('svc-label').textContent = c.services.label;
  document.getElementById('svc-title').innerHTML = esc(c.services.title_line1) + '<br/>' + esc(c.services.title_line2);
  document.getElementById('svc-sub').textContent  = c.services.subtext;
  document.getElementById('services-grid').innerHTML = c.services.items
    .filter(s => s.visible !== false)
    .map(s => `<div class="service-card">
      <div class="svc-icon"><i class="fas ${esc(s.icon)}"></i></div>
      <h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>
    </div>`).join('');

  // ── why
  document.getElementById('why-label').textContent = c.why.label;
  document.getElementById('why-title').innerHTML = esc(c.why.title_line1) + '<br/>' + esc(c.why.title_line2);
  document.getElementById('why-panel-h').textContent = c.why.panel_heading;
  document.getElementById('why-panel-p').textContent = c.why.panel_body;
  document.getElementById('why-list').innerHTML = c.why.items.map(w =>
    `<div class="why-item">
      <div class="why-dot"><i class="fas ${esc(w.icon)}"></i></div>
      <div><h4>${esc(w.title)}</h4><p>${esc(w.body)}</p></div>
    </div>`).join('');

  // ── projects (visible + optional link)
  document.getElementById('proj-label').textContent = c.projects.label;
  document.getElementById('proj-title').textContent = c.projects.title;
  document.getElementById('proj-sub').textContent   = c.projects.subtext;
  document.getElementById('projects-grid').innerHTML = c.projects.items
    .filter(p => p.visible !== false)
    .map(p => `<div class="project-card">
      <h3>${esc(p.emoji)} ${esc(p.title)}</h3>
      <p>${esc(p.body)}</p>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${p.link ? `<a class="proj-link" href="${esc(p.link)}" target="_blank">View Project <i class="fas fa-arrow-up-right-from-square"></i></a>` : ''}
    </div>`).join('');

  // ── contact
  document.getElementById('ct-label').textContent = c.contact.label;
  document.getElementById('ct-title').textContent = c.contact.title;
  document.getElementById('ct-sub').textContent   = c.contact.subtext;
  const ctBtn = document.getElementById('ct-btn');
  ctBtn.textContent = c.contact.btn_text;
  // WhatsApp prefill on primary CTA if first contact is WA
  const waNum = c.social?.whatsapp_number;
  const waMsg = c.social?.whatsapp_prefill || '';
  ctBtn.href = waNum
    ? `https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}`
    : (c.contact.items[0]?.href || '#');

  document.getElementById('contact-grid').innerHTML = c.contact.items.map(i => {
    const iconClass = i.icon.includes('fab') ? i.icon : 'fas ' + i.icon;
    return `<div class="contact-card">
      <div class="contact-icon"><i class="${esc(iconClass)}"></i></div>
      <p>${esc(i.label)}</p>
      <a href="${esc(i.href)}" ${i.href.startsWith('http')||i.href.startsWith('https://wa')?'target="_blank"':''}>${esc(i.text)}</a>
    </div>`;
  }).join('');

  // business hours
  if (c.contact.business_hours) {
    document.getElementById('biz-hours-wrap').innerHTML =
      `<div class="biz-hours"><i class="fas fa-clock"></i> ${esc(c.contact.business_hours)}</div>`;
  }

  // social bar
  const soc = c.social || {};
  const socLinks = [
    { key:'facebook',  icon:'fab fa-facebook',  label:'Facebook' },
    { key:'twitter',   icon:'fab fa-x-twitter', label:'X/Twitter' },
    { key:'linkedin',  icon:'fab fa-linkedin',  label:'LinkedIn' },
    { key:'github',    icon:'fab fa-github',    label:'GitHub' },
  ].filter(s => soc[s.key]);
  if (socLinks.length) {
    document.getElementById('social-bar-wrap').innerHTML =
      `<div class="social-bar">${socLinks.map(s =>
        `<a class="social-btn" href="${esc(soc[s.key])}" target="_blank" aria-label="${s.label}">
          <i class="${s.icon}"></i></a>`
      ).join('')}</div>`;
  }

  // maps embed
  if (c.contact.maps_embed) {
    document.getElementById('maps-wrap').innerHTML =
      `<div style="border-radius:20px;overflow:hidden;box-shadow:var(--raised);">
        <iframe src="${esc(c.contact.maps_embed)}" width="100%" height="280"
          style="border:0;display:block;" allowfullscreen loading="lazy"></iframe>
      </div>`;
  }

  // footer
  document.getElementById('footer-text').innerHTML =
    c.footer.text.replace('NextLink MW','<span>NextLink MW</span>');

  // scroll observer
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
        const a = document.querySelector(`.nav-links a[href="#${e.target.id}"]`);
        if (a) a.classList.add('active');
      }
    });
  }, {threshold:0.4});
  document.querySelectorAll('section[id]').forEach(s => obs.observe(s));
}

// theme toggle
const btn  = document.getElementById('theme-btn');
const root = document.documentElement;
const icon = btn.querySelector('i');
const saved = localStorage.getItem('theme') || 'light';
root.setAttribute('data-theme', saved);
icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
btn.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
});

// fetch content
fetch(`https://raw.githubusercontent.com/${REPO}/main/content.json?_=${Date.now()}`)
  .then(r => r.json())
  .then(c => { sessionStorage.setItem(CACHE, JSON.stringify(c)); render(c); })
  .catch(() => { const c = sessionStorage.getItem(CACHE); if (c) render(JSON.parse(c)); });
</script>
</body>
</html>
