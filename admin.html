<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NextLink MW — CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #1C2126; --card: #21262C; --inset: #171B1F;
      --tx-1:  #E8ECF0; --tx-2: #9AA5B1; --tx-3: #626C77;
      --blue:  #6B9BFF; --green: #5FD37D; --red: #F2695E;
      --sh-l:  rgba(255,255,255,0.04); --sh-d: rgba(0,0,0,0.55);
      --raised:    -6px -6px 14px var(--sh-l),  6px  6px 14px var(--sh-d);
      --raised-lg: -10px -10px 24px var(--sh-l), 10px 10px 24px var(--sh-d);
      --inset-sh:  inset -4px -4px 10px var(--sh-l), inset 4px 4px 10px var(--sh-d);
      --r: 14px; --r-lg: 20px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--tx-1); min-height: 100vh; }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-box {
      background: var(--card); border-radius: var(--r-lg); box-shadow: var(--raised-lg);
      padding: 48px 40px; width: 100%; max-width: 400px; text-align: center;
    }
    .login-box .dial {
      width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px;
      background: var(--card); box-shadow: var(--raised-lg);
      display: flex; align-items: center; justify-content: center;
    }
    .login-box .dial .inner {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--inset); box-shadow: var(--inset-sh);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: var(--blue);
    }
    .login-box h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .login-box p  { font-size: 0.82rem; color: var(--tx-2); margin-bottom: 28px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { font-size: 0.75rem; font-weight: 600; color: var(--tx-3); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 16px; border: none; outline: none;
      background: var(--inset); box-shadow: var(--inset-sh);
      border-radius: var(--r); color: var(--tx-1); font-family: inherit; font-size: 0.9rem;
    }
    .field input::placeholder { color: var(--tx-3); }
    .btn {
      width: 100%; padding: 13px; border: none; cursor: pointer;
      background: var(--blue); color: #fff; border-radius: var(--r);
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      box-shadow: var(--raised); transition: transform 100ms, box-shadow 100ms;
    }
    .btn:hover  { transform: translateY(-1px); }
    .btn:active { box-shadow: var(--inset-sh); transform: translateY(0); }
    .btn.danger { background: var(--red); }
    .btn.success { background: var(--green); color: #1C2126; }
    #login-err { color: var(--red); font-size: 0.8rem; margin-top: 10px; display: none; }

    /* ── APP SHELL ── */
    #app { display: none; }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--card); box-shadow: var(--raised-lg);
      padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .topbar .logo { font-size: 1.1rem; font-weight: 800; }
    .topbar .logo span { color: var(--blue); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .save-btn {
      padding: 9px 22px; border: none; cursor: pointer;
      background: var(--blue); color: #fff; border-radius: var(--r);
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      box-shadow: var(--raised); transition: transform 100ms, box-shadow 100ms;
      display: flex; align-items: center; gap: 8px;
    }
    .save-btn:hover  { transform: translateY(-1px); }
    .save-btn:active { box-shadow: var(--inset-sh); transform: none; }
    .save-btn.saving { background: var(--tx-3); cursor: wait; }
    .save-btn.saved  { background: var(--green); color: #1C2126; }
    .logout-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: var(--raised);
      color: var(--tx-2); font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 150ms;
    }
    .logout-btn:hover { color: var(--red); }

    /* ── LAYOUT ── */
    .layout { display: flex; min-height: calc(100vh - 64px); }
    .sidebar {
      width: 220px; flex-shrink: 0; padding: 24px 16px;
      border-right: 1px solid rgba(255,255,255,0.04);
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: var(--r); cursor: pointer;
      font-size: 0.84rem; font-weight: 500; color: var(--tx-2);
      transition: background 150ms, color 150ms, box-shadow 150ms;
      margin-bottom: 4px;
    }
    .sidebar-item i { width: 16px; text-align: center; font-size: 0.8rem; }
    .sidebar-item:hover { color: var(--tx-1); background: var(--inset); }
    .sidebar-item.active {
      color: var(--blue); background: var(--inset); box-shadow: var(--inset-sh);
    }
    .sidebar-section {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--tx-3);
      padding: 16px 14px 6px;
    }
    .preview-link {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: var(--r);
      font-size: 0.8rem; color: var(--tx-3); text-decoration: none;
      transition: color 150ms;
    }
    .preview-link:hover { color: var(--blue); }

    /* ── PANELS ── */
    .main { flex: 1; padding: 32px; overflow-y: auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .panel-sub   { font-size: 0.82rem; color: var(--tx-2); margin-bottom: 28px; }

    /* ── FORM ELEMENTS ── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--tx-3); margin-bottom: 7px;
    }
    .form-group input, .form-group textarea {
      width: 100%; padding: 11px 16px; border: none; outline: none;
      background: var(--inset); box-shadow: var(--inset-sh);
      border-radius: var(--r); color: var(--tx-1);
      font-family: inherit; font-size: 0.88rem; resize: vertical;
      transition: box-shadow 150ms;
    }
    .form-group input:focus, .form-group textarea:focus {
      box-shadow: var(--inset-sh), 0 0 0 2px var(--blue);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-card {
      background: var(--card); border-radius: var(--r-lg); box-shadow: var(--raised);
      padding: 24px; margin-bottom: 16px;
    }
    .form-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; cursor: pointer;
    }
    .form-card-header h3 { font-size: 0.9rem; font-weight: 700; }
    .form-card-header .toggle-icon { color: var(--tx-3); font-size: 0.8rem; transition: transform 200ms; }
    .form-card-body { overflow: hidden; transition: max-height 300ms ease; }

    /* repeater */
    .repeater-item {
      background: var(--inset); box-shadow: var(--inset-sh);
      border-radius: var(--r); padding: 18px; margin-bottom: 12px; position: relative;
    }
    .repeater-item .item-num {
      font-size: 0.7rem; font-weight: 700; color: var(--tx-3);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;
    }
    .repeater-item .del-btn {
      position: absolute; top: 12px; right: 12px;
      width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: var(--raised);
      color: var(--tx-3); font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 150ms;
    }
    .repeater-item .del-btn:hover { color: var(--red); }
    .add-btn {
      padding: 9px 18px; border: none; cursor: pointer;
      background: var(--card); color: var(--blue);
      border-radius: var(--r); font-family: inherit; font-size: 0.82rem; font-weight: 600;
      box-shadow: var(--raised); display: flex; align-items: center; gap: 8px;
      transition: transform 100ms, box-shadow 100ms;
    }
    .add-btn:hover  { transform: translateY(-1px); }
    .add-btn:active { box-shadow: var(--inset-sh); transform: none; }

    /* tags input */
    .tags-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 12px; background: var(--inset); box-shadow: var(--inset-sh);
      border-radius: var(--r); min-height: 44px; cursor: text; }
    .tags-input .tag-chip {
      background: var(--card); box-shadow: var(--raised);
      border-radius: 99px; padding: 3px 10px 3px 12px;
      font-size: 0.75rem; font-weight: 600; color: var(--blue);
      display: flex; align-items: center; gap: 6px;
    }
    .tags-input .tag-chip button {
      background: none; border: none; cursor: pointer; color: var(--tx-3);
      padding: 0; font-size: 0.7rem; line-height: 1;
    }
    .tags-input .tag-chip button:hover { color: var(--red); }
    .tags-input input {
      border: none; outline: none; background: transparent;
      color: var(--tx-1); font-family: inherit; font-size: 0.84rem;
      min-width: 80px; flex: 1; padding: 2px 4px; box-shadow: none !important;
    }

    /* toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--card); box-shadow: var(--raised-lg);
      border-radius: var(--r); padding: 14px 20px;
      font-size: 0.85rem; font-weight: 500; color: var(--tx-1);
      display: flex; align-items: center; gap: 10px;
      transform: translateY(80px); opacity: 0;
      transition: transform 300ms, opacity 300ms;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast .ti { font-size: 1rem; }
    #toast.ok  .ti { color: var(--green); }
    #toast.err .ti { color: var(--red); }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
      .main { padding: 16px; }
    }
  </style>
  
<style>
  .color-row { display:flex; align-items:center; gap:12px; }
  .color-row input[type=color] {
    width:44px; height:44px; border:none; cursor:pointer;
    border-radius:var(--r); background:var(--inset);
    box-shadow:var(--inset-sh); padding:4px;
  }
  .color-row input[type=text] { flex:1; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; }
  .toggle-row label { font-size:0.85rem; font-weight:500; color:var(--tx-1); }
  .tog {
    width:48px; height:26px; border-radius:99px; border:none; cursor:pointer;
    background:var(--inset); box-shadow:var(--inset-sh);
    position:relative; transition:background 200ms;
  }
  .tog.on { background:var(--green); }
  .tog::after {
    content:''; position:absolute; top:3px; left:3px;
    width:20px; height:20px; border-radius:50%;
    background:var(--card); box-shadow:var(--raised);
    transition:transform 200ms;
  }
  .tog.on::after { transform:translateX(22px); }
  .theme-options { display:flex; gap:10px; margin-top:6px; }
  .theme-opt {
    flex:1; padding:10px; border:none; cursor:pointer; border-radius:var(--r);
    font-family:inherit; font-size:0.82rem; font-weight:600;
    background:var(--inset); box-shadow:var(--inset-sh); color:var(--tx-2);
    transition:box-shadow 150ms, color 150ms;
  }
  .theme-opt.selected { box-shadow:var(--raised); color:var(--blue); }
  .drag-handle { cursor:grab; color:var(--tx-3); padding:0 8px 0 0; font-size:0.9rem; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="dial"><div class="inner"><i class="fas fa-lock"></i></div></div>
    <h2>NextLink CMS</h2>
    <p>Enter your password to access the editor.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="••••••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" onclick="doLogin()"><i class="fas fa-arrow-right-to-bracket"></i> &nbsp; Sign In</button>
    <div id="login-err"><i class="fas fa-circle-exclamation"></i> Wrong password.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo"><span>Next</span>Link CMS</div>
    <div class="topbar-right">
      <button class="save-btn" id="save-btn" onclick="saveContent()">
        <i class="fas fa-floppy-disk"></i> Save Changes
      </button>
      <button class="logout-btn" onclick="doLogout()" title="Sign out"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">Content</div>
      <div class="sidebar-item active" onclick="showPanel('hero')"     data-panel="hero">    <i class="fas fa-house"></i> Hero</div>
      <div class="sidebar-item"        onclick="showPanel('stats')"    data-panel="stats">   <i class="fas fa-chart-bar"></i> Stats</div>
      <div class="sidebar-item"        onclick="showPanel('services')" data-panel="services"><i class="fas fa-wrench"></i> Services</div>
      <div class="sidebar-item"        onclick="showPanel('why')"      data-panel="why">     <i class="fas fa-medal"></i> Why Us</div>
      <div class="sidebar-item"        onclick="showPanel('projects')" data-panel="projects"><i class="fas fa-rocket"></i> Projects</div>
      <div class="sidebar-item"        onclick="showPanel('contact')"  data-panel="contact"> <i class="fas fa-envelope"></i> Contact</div>
      <div class="sidebar-section">Settings</div>
      <div class="sidebar-item"        onclick="showPanel('branding')" data-panel="branding"><i class="fas fa-palette"></i> Branding</div>
      <div class="sidebar-item"        onclick="showPanel('social')"   data-panel="social">  <i class="fas fa-share-nodes"></i> Social</div>
      <div class="sidebar-item"        onclick="showPanel('analytics')"data-panel="analytics"><i class="fas fa-chart-line"></i> Analytics</div>
      <div class="sidebar-item"        onclick="showPanel('site')"     data-panel="site">    <i class="fas fa-gear"></i> Site</div>
      <div class="sidebar-section">Links</div>
      <a class="preview-link" href="https://nehemiahnganjo.github.io/nextlinkmw/" target="_blank">
        <i class="fas fa-arrow-up-right-from-square"></i> View Live Site
      </a>
    </aside>
    <main class="main" id="main-content"></main>
  </div>
</div>

<div id="toast"><i class="fas fa-check-circle ti"></i> <span id="toast-msg"></span></div>

<script>
const ENCRYPTED_BLOB = 'aJzd0jrVANrIJtKROAQciraBFPROvCZKv7/Gl8IR3Bxo82esLArfZuS8GAdrMk8v2mk/lsf//bYRaW2OQvTjQ6OgGK9FDMQg9WJxEoxJ/Xxsdzak';
const REPO = 'Nehemiahnganjo/nextlinkmw';
const FILE = 'content.json';
const API  = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
let TOKEN = '', content = {}, fileSHA = '';

// ── DECRYPT ────────────────────────────────────────────────
async function decryptToken(password) {
  const raw  = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km   = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},
    km, {name:'AES-GCM',length:256}, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(plain);
}

async function doLogin() {
  const pw = document.getElementById('pw-input').value; if (!pw) return;
  const btn = document.querySelector('#login-screen .btn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking…'; btn.disabled = true;
  try {
    const tok  = await decryptToken(pw);
    const resp = await fetch(API, {headers:{Authorization:'token '+tok}});
    if (!resp.ok) throw new Error();
    const d = await resp.json();
    TOKEN = tok; fileSHA = d.sha;
    content = JSON.parse(atob(d.content.replace(/\n/g,'')));
    sessionStorage.setItem('cms_pw', pw);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildAllPanels(); showPanel('hero');
  } catch(e) {
    document.getElementById('login-err').style.display = 'block';
  } finally {
    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> &nbsp; Sign In'; btn.disabled = false;
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
const _spw = sessionStorage.getItem('cms_pw');
if (_spw) { document.getElementById('pw-input').value = _spw; doLogin(); }

function doLogout() {
  sessionStorage.removeItem('cms_pw'); TOKEN=''; content={}; fileSHA='';
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('login-err').style.display='none';
}

// ── NAV ─────────────────────────────────────────────────────
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  document.getElementById('panel-'+name)?.classList.add('active');
  document.querySelector(`.sidebar-item[data-panel="${name}"]`)?.classList.add('active');
}

// ── TOAST ───────────────────────────────────────────────────
function toast(msg,ok=true) {
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.className='show '+(ok?'ok':'err');
  t.querySelector('.ti').className='ti fas '+(ok?'fa-check-circle':'fa-circle-exclamation');
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),3000);
}

// ── HELPERS ─────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function field(label,val,path,type='input',rows=2) {
  const tag = type==='textarea'
    ? `<textarea rows="${rows}" data-path="${path}">${esc(val)}</textarea>`
    : `<input type="text" value="${esc(val)}" data-path="${path}"/>`;
  return `<div class="form-group"><label>${label}</label>${tag}</div>`;
}
function colorField(label,val,path) {
  const id='cf_'+Math.random().toString(36).slice(2);
  setTimeout(()=>{
    const sw=document.getElementById(id);
    if(sw){ sw.value=val; sw.addEventListener('input',e=>{
      const txt=document.querySelector(`[data-path="${path}"]`);
      if(txt)txt.value=e.target.value;
    });}
  },0);
  return `<div class="form-group"><label>${label}</label>
    <div class="color-row">
      <input type="color" id="${id}" value="${esc(val)}"/>
      <input type="text" value="${esc(val)}" data-path="${path}" oninput="syncColor('${id}',this.value)"/>
    </div></div>`;
}
function syncColor(id,val){const el=document.getElementById(id);if(el)el.value=val;}
function toggleField(label,val,path) {
  const id='tog_'+Math.random().toString(36).slice(2);
  return `<div class="form-group toggle-row">
    <label>${label}</label>
    <button class="tog ${val?'on':''}" id="${id}" data-path="${path}" data-bool="true"
      onclick="this.classList.toggle('on')">
    </button></div>`;
}
function themeField(val,path) {
  return `<div class="form-group"><label>Default Theme</label>
    <div class="theme-options">
      <button class="theme-opt ${val==='light'?'selected':''}" onclick="pickTheme(this,'light','${path}')">☀️ Light</button>
      <button class="theme-opt ${val==='dark'?'selected':''}"  onclick="pickTheme(this,'dark','${path}')">🌙 Dark</button>
    </div>
    <input type="hidden" data-path="${path}" value="${esc(val)}"/>
  </div>`;
}
function pickTheme(el,val,path) {
  el.closest('.theme-options').querySelectorAll('.theme-opt').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  el.closest('.form-group').querySelector(`[data-path="${path}"]`).value=val;
}
function card(title,bodyHtml,open=true) {
  const id='fc_'+Math.random().toString(36).slice(2);
  setTimeout(()=>{const b=document.getElementById(id);if(b)b.style.maxHeight=open?b.scrollHeight+'px':'0';},0);
  return `<div class="form-card">
    <div class="form-card-header" onclick="toggleCard('${id}')">
      <h3>${title}</h3><i class="fas fa-chevron-${open?'up':'down'} toggle-icon" id="ic_${id}"></i>
    </div>
    <div class="form-card-body" id="${id}">${bodyHtml}</div>
  </div>`;
}
function toggleCard(id) {
  const b=document.getElementById(id),ic=document.getElementById('ic_'+id);
  if(b.style.maxHeight&&b.style.maxHeight!=='0px'){b.style.maxHeight='0';ic.className='fas fa-chevron-down toggle-icon';}
  else{b.style.maxHeight=b.scrollHeight+5000+'px';ic.className='fas fa-chevron-up toggle-icon';}
}

// ── TAGS ────────────────────────────────────────────────────
function tagsWidget(tags,pathPrefix) {
  const id='tags_'+Math.random().toString(36).slice(2);
  setTimeout(()=>initTagsWidget(id,tags,pathPrefix),0);
  return `<div class="form-group"><label>Tags</label><div class="tags-input" id="${id}" data-tags-path="${pathPrefix}"></div></div>`;
}
function initTagsWidget(id,tags,pathPrefix) {
  const el=document.getElementById(id); if(!el) return;
  let current=[...tags];
  function render() {
    el.innerHTML=current.map((t,i)=>
      `<span class="tag-chip">${esc(t)}<button onclick="removeTag('${id}',${i})">×</button></span>`
    ).join('')+`<input placeholder="Add tag, Enter" onkeydown="addTag(event,'${id}')"/>`;
    const parts=pathPrefix.split('.');
    let obj=content;
    for(let i=0;i<parts.length-1;i++) obj=isNaN(parts[i])?obj[parts[i]]:obj[+parts[i]];
    obj[parts[parts.length-1]]=current;
  }
  el._tags=current; el._render=render; render();
}
function addTag(e,id) {
  if(e.key!=='Enter'&&e.key!==',') return; e.preventDefault();
  const el=document.getElementById(id);
  const val=e.target.value.trim().replace(/,$/,'');
  if(val&&!el._tags.includes(val)){el._tags.push(val);el._render();}
  e.target.value='';
}
function removeTag(id,idx) {const el=document.getElementById(id);el._tags.splice(idx,1);el._render();}

// ── GENERIC REPEATER ────────────────────────────────────────
const defaults = {
  stats:    ()=>([content.stats,null,{number:'0',label:'New Stat'}]),
  services: ()=>([content.services.items,'services',{icon:'fa-star',title:'New Service',body:'Description.',visible:true}]),
  why:      ()=>([content.why.items,'why',{icon:'fa-check',title:'New Point',body:'Details.'}]),
  projects: ()=>([content.projects.items,'projects',{emoji:'🚀',title:'New Project',body:'Description.',tags:[],link:'',visible:true}]),
  contact:  ()=>([content.contact.items,'contact',{icon:'fa-phone',label:'Phone',text:'+265 xxx',href:'tel:+265xxx'}]),
};
function addItem(section) {
  const [arr,,def] = defaults[section]();
  arr.push({...def}); rebuildPanel(section);
}
function delItem(section,subkey,idx) {
  const [arr] = defaults[section](); arr.splice(idx,1); rebuildPanel(section);
}
function rebuildPanel(name) {
  flushInputs();
  const builders={hero:buildHero,stats:buildStats,services:buildServices,why:buildWhy,
                   projects:buildProjects,contact:buildContact,branding:buildBranding,
                   social:buildSocial,analytics:buildAnalytics,site:buildSite};
  const panel=document.getElementById('panel-'+name);
  const tmp=document.createElement('div'); tmp.innerHTML=builders[name]();
  panel.replaceWith(tmp.querySelector('.panel')); showPanel(name);
}

// ── FLUSH ────────────────────────────────────────────────────
function flushInputs() {
  document.querySelectorAll('[data-path]').forEach(inp => {
    const path=inp.dataset.path.split('.');
    let obj=content;
    for(let i=0;i<path.length-1;i++) obj=isNaN(path[i])?obj[path[i]]:obj[+path[i]];
    const last=path[path.length-1];
    const val = inp.dataset.bool==='true' ? inp.classList.contains('on') : inp.value;
    if(isNaN(last)) obj[last]=val; else obj[+last]=val;
  });
}

// ── SAVE ─────────────────────────────────────────────────────
async function saveContent() {
  flushInputs();
  const btn=document.getElementById('save-btn');
  btn.className='save-btn saving'; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving…';
  try {
    const m=await(await fetch(API,{headers:{Authorization:'token '+TOKEN}})).json();
    fileSHA=m.sha;
    const resp=await fetch(API,{method:'PUT',
      headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify({message:'CMS update',
        content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:fileSHA})
    });
    if(!resp.ok) throw new Error(await resp.text());
    fileSHA=(await resp.json()).content.sha;
    btn.className='save-btn saved'; btn.innerHTML='<i class="fas fa-check"></i> Saved!';
    toast('Saved to GitHub. Site updates in ~30 seconds.');
    setTimeout(()=>{btn.className='save-btn';btn.innerHTML='<i class="fas fa-floppy-disk"></i> Save Changes';},2500);
  } catch(e) {
    btn.className='save-btn'; btn.innerHTML='<i class="fas fa-floppy-disk"></i> Save Changes';
    toast('Save failed: '+e.message,false);
  }
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveContent();}});
